name: CI

# Frontend: lint, typecheck, test, build, dependency audit.
# Backend:  lint, dependency audit, config/migration check, test (SQLite).
# PostgreSQL: the same suite plus PostgreSQL-only integration tests, run against
#   a real ephemeral PostgreSQL service so cross-engine behaviour (FK
#   enforcement, unique constraints, timestamptz, JSON, migrations) is verified.
# No real secrets are required — placeholder values and the sandbox payment
# adapter are used throughout.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npx oxlint src --deny-warnings
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      APP_DATABASE_URL: sqlite:///./ci.db
      APP_SECRET_KEY: ci-secret
      APP_EXPOSE_DEV_TOKENS: "true"
      APP_PAYMENT_PROVIDER: fake
      APP_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      APP_RATE_LIMIT_ATTEMPTS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check app tests
      - name: Dependency audit (pip-audit)
        run: python -m pip_audit
      - name: Configuration check
        # Fails fast if the app cannot import with the test configuration.
        run: python -c "from app.main import app; assert app is not None"
      - name: Migrations upgrade/downgrade
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Unit tests
        run: python -m pytest

  postgres:
    # Runs the full backend suite against a real PostgreSQL service, plus the
    # PostgreSQL-only integration tests. This closes the "SQLite only" gap from
    # earlier stages: SQLite does not enforce foreign keys and differs on
    # timestamptz/JSON/DDL, so production behaviour is verified here instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: studio_ci
        ports:
          - 5432:5432
        # Wait until PostgreSQL is actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U studio -d studio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      APP_DATABASE_URL: postgresql+psycopg://studio:ci-postgres-password@127.0.0.1:5432/studio_ci
      APP_TEST_POSTGRES_URL: postgresql+psycopg://studio:ci-postgres-password@127.0.0.1:5432/studio_ci
      APP_SECRET_KEY: ci-secret
      APP_EXPOSE_DEV_TOKENS: "true"
      APP_PAYMENT_PROVIDER: fake
      APP_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      APP_RATE_LIMIT_ATTEMPTS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations upgrade/downgrade (PostgreSQL)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tests (PostgreSQL)
        run: python -m pytest
