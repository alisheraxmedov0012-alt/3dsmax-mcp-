name: CI

# Runs the frontend and backend test suites plus typecheck/build.
# No secrets are required: the backend tests use SQLite and the sandbox payment
# adapter with placeholder values defined inline.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      APP_DATABASE_URL: sqlite:///./ci.db
      APP_SECRET_KEY: ci-secret
      APP_EXPOSE_DEV_TOKENS: "true"
      APP_PAYMENT_PROVIDER: fake
      APP_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      APP_RATE_LIMIT_ATTEMPTS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
