name: CI

# Frontend: lint, typecheck, test, build, dependency audit.
# Backend:  lint, dependency audit, config/migration check, test (SQLite).
# No real secrets are required — the backend uses SQLite, placeholder values and
# the sandbox payment adapter.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npx oxlint src --deny-warnings
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      APP_DATABASE_URL: sqlite:///./ci.db
      APP_SECRET_KEY: ci-secret
      APP_EXPOSE_DEV_TOKENS: "true"
      APP_PAYMENT_PROVIDER: fake
      APP_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      APP_RATE_LIMIT_ATTEMPTS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check app tests
      - name: Dependency audit (pip-audit)
        run: python -m pip_audit
      - name: Configuration check
        # Fails fast if the app cannot import with the test configuration.
        run: python -c "from app.main import app; assert app is not None"
      - name: Migrations upgrade/downgrade
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Unit tests
        run: python -m pytest
